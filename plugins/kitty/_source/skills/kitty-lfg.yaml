directory: kitty-lfg
frontmatter:
  name: kitty-lfg
  description: |
    Full autonomous engineering workflow — plan, work, review with Cartographing Kittens-first inline-first orchestration. Requires the Cartographing Kittens MCP server (`uvx cartographing-kittens`).
  argument-hint: '[feature description]'
  disable-model-invocation: true
  allowed-tools:
  - Read
  - Edit
  - Write
  - Bash
  - Grep
  - Glob
  - mcp__plugin_kitty_kitty__query_litter_box
  - mcp__plugin_kitty_kitty__query_treat_box
  - mcp__plugin_kitty_kitty__add_litter_box_entry
  - mcp__plugin_kitty_kitty__add_treat_box_entry
  - mcp__plugin_kitty_kitty__index_codebase
