body: |
  Cartographing Kittens LFG — autonomous pipeline. Run all steps in order.

  ## Orchestration model

  `kitty:lfg` runs in **pipeline mode**: no `AskUserQuestion` prompts — every gated decision
  picks the recommended option silently, and a permission wall fails the item into the §6 ledger
  rather than hanging. It **sequences the three phase skills** (`kitty:plan` → `kitty:work` →
  `kitty:review`), each of which builds its own Context Bundle and dispatches its own `*.orch.js`
  fan-out; `lfg` has no orchestration script of its own.

  - **One shared run-id** spans the whole pipeline; the phases append the run journal strictly
    sequentially (`<plan-slug>-<UTC>-<6char>`, per
    [`kitty/references/bundle-format.md`](kitty/references/bundle-format.md)).
  - **Advisory lock.** Take `.pawprints/runs/<plan-slug>.lock` at run start (spec §10.4); refuse
    or wait if it is held by another run.
  - **No work without an approved plan.** After the plan phase, auto-approve the recommended plan
    via `plan_set_status(path, "ready")` so `kitty:work`'s entry self-check passes — the gate is
    satisfied by lfg's own plan phase, never bypassed.

  ## Memory Contract

  Every phase must use the shared memory protocol from
  `kitty/references/memory-workflow.md`:
  - Planning calls `query_litter_box` and `query_treat_box`, then writes `Memory Context`
    into the plan.
  - Work applies relevant memory and records validated implementation lessons with
    `add_litter_box_entry` and `add_treat_box_entry`.
  - Review calls `query_litter_box` and `query_treat_box`, applies relevant memory, and
    records validated review lessons with `add_litter_box_entry` and `add_treat_box_entry`.
  - Final output includes memory queried/applied/recorded counts.

  ## Sequential Phase

  1. `/kitty:plan $ARGUMENTS` — Record the plan file path for steps 3 and 5, then auto-approve
     the recommended plan (`plan_set_status(path, "ready")`) so step 2's entry gate passes.
  2. `/kitty:work <plan-path>` — Execute the plan via its per-unit run-boundary loop.

  ## Parallel Phase

  After work completes, run steps 3 and 4 in the best supported way for the active runtime.
  Parallel execution is optional, not required:

  3. `/kitty:review mode:report-only plan:<plan-path-from-step-1>` — Review in report-only mode
  4. Run full test suite: `uv run pytest` (or project's test command)

  Wait for both to complete.

  ## Autofix Phase

  5. `/kitty:review mode:autofix plan:<plan-path-from-step-1>` — Apply safe fixes from review findings

  ## Finalize

  6. Commit, push, and create PR only when explicitly requested or when the surrounding workflow requires it
  7. Output `<promise>DONE</promise>` when the requested autonomous workflow is complete

  ## Contract

  - Must remain meaningful without swarm primitives.
  - Must not assume background agents, automatic PR creation, or persistent task teams.
  - Must not skip litter/treat memory preflight or postflight in plan, work, or review phases.
agents:
  openai:
    allow_implicit_invocation: false
    category: developer-tools
